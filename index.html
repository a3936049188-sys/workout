<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0e0f1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="운동일지">
  <title>운동 일지</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- 헤더 (캘린더 탭에서만 표시) -->
  <header class="app-header" id="cal-header">
    <button class="month-nav-btn" onclick="prevMonth()">‹</button>
    <button class="month-title-btn" onclick="goToToday()">
      <span id="month-label">2026년 6월</span>
    </button>
    <button class="month-nav-btn" onclick="nextMonth()">›</button>
  </header>

  <!-- 캘린더 뷰 -->
  <div id="view-calendar" class="view active">
    <div class="weekday-row">
      <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
    </div>
    <div id="calendar-grid"></div>
  </div>

  <!-- 타이머 뷰 -->
  <div id="view-timer" class="view">
    <div class="view-title">타이머</div>
    <div class="timer-card" id="timer-card">
      <div class="timer-ring-wrap">
        <svg class="timer-ring" viewBox="0 0 160 160" width="160" height="160">
          <circle cx="80" cy="80" r="70" class="timer-ring-bg"/>
          <circle cx="80" cy="80" r="70" class="timer-ring-fill" id="timer-ring-fill"/>
        </svg>
        <div class="timer-center">
          <div class="timer-display" id="timer-display">30:00</div>
          <div class="timer-status" id="timer-status">준비</div>
        </div>
      </div>
      <div class="timer-presets">
        <button class="preset-btn" onclick="setTimer(10)">10분</button>
        <button class="preset-btn" onclick="setTimer(20)">20분</button>
        <button class="preset-btn active" onclick="setTimer(30)">30분</button>
        <button class="preset-btn" onclick="setTimer(45)">45분</button>
        <button class="preset-btn" onclick="setTimer(60)">60분</button>
      </div>
      <div class="timer-custom">
        <button class="timer-adj" onclick="adjustTimer(-5)">－5분</button>
        <span id="timer-custom-display">30분</span>
        <button class="timer-adj" onclick="adjustTimer(5)">＋5분</button>
      </div>
      <div class="timer-controls">
        <button id="btn-timer-start" class="btn-timer-start" onclick="toggleTimer()">▶ 시작</button>
        <button class="btn-timer-reset" onclick="resetTimer()">↺</button>
      </div>
    </div>
  </div>

  <!-- 통계 뷰 -->
  <div id="view-stats" class="view">
    <div class="view-title">통계</div>
    <div id="stats-content"></div>
  </div>

  <!-- 하단 네비게이션 -->
  <nav class="tab-nav">
    <button class="tab-btn active" data-tab="calendar" onclick="switchTab('calendar')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      <span>캘린더</span>
    </button>
    <button class="tab-btn" data-tab="timer" onclick="switchTab('timer')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
      </svg>
      <span>타이머</span>
    </button>
    <button class="fab-center" onclick="openTodayWorkout()">💪</button>
    <button class="tab-btn" data-tab="stats" onclick="switchTab('stats')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
      </svg>
      <span>통계</span>
    </button>
  </nav>
</div>

<!-- ── 운동 기록 모달 ── -->
<div id="workout-modal" class="modal-overlay" onclick="if(event.target===this)closeWorkoutModal()">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-top">
      <div id="modal-date-label" class="modal-date-label"></div>
      <button class="modal-close-btn" onclick="closeWorkoutModal()">✕</button>
    </div>
    <div id="modal-exercise-list"></div>
    <button class="btn-add-exercise" onclick="openAddModal()">＋ 운동 추가</button>
    <button class="btn-save-workout" onclick="saveModalWorkout()">✅ 저장</button>
  </div>
</div>

<!-- ── 운동 선택 모달 ── -->
<div id="add-modal" class="modal-overlay" onclick="if(event.target===this)closeAddModal()">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">운동 추가</div>

    <div class="exercise-category">
      <div class="category-label">💪 상체</div>
      <div class="exercise-grid">
        <button class="exercise-btn" data-name="푸시업" onclick="selectPreset('푸시업','reps','💪')">💪 푸시업</button>
        <button class="exercise-btn" data-name="와이드 푸시업" onclick="selectPreset('와이드 푸시업','reps','💪')">💪 와이드 푸시업</button>
        <button class="exercise-btn" data-name="다이아몬드 푸시업" onclick="selectPreset('다이아몬드 푸시업','reps','💪')">💪 다이아몬드</button>
        <button class="exercise-btn" data-name="파이크 푸시업" onclick="selectPreset('파이크 푸시업','reps','💪')">💪 파이크 푸시업</button>
        <button class="exercise-btn" data-name="딥스" onclick="selectPreset('딥스','reps','🤸')">🤸 딥스</button>
        <button class="exercise-btn" data-name="친업 / 풀업" onclick="selectPreset('친업 / 풀업','reps','🏋️')">🏋️ 친업 / 풀업</button>
      </div>
    </div>
    <div class="exercise-category">
      <div class="category-label">🔥 코어</div>
      <div class="exercise-grid">
        <button class="exercise-btn" data-name="플랭크" onclick="selectPreset('플랭크','time','🔥')">🔥 플랭크</button>
        <button class="exercise-btn" data-name="사이드 플랭크" onclick="selectPreset('사이드 플랭크','time','🔥')">🔥 사이드 플랭크</button>
        <button class="exercise-btn" data-name="크런치" onclick="selectPreset('크런치','reps','🔥')">🔥 크런치</button>
        <button class="exercise-btn" data-name="V업" onclick="selectPreset('V업','reps','🔥')">🔥 V업</button>
        <button class="exercise-btn" data-name="마운틴 클라이머" onclick="selectPreset('마운틴 클라이머','reps','⚡')">⚡ 마운틴 클라이머</button>
        <button class="exercise-btn" data-name="레그레이즈" onclick="selectPreset('레그레이즈','reps','🔥')">🔥 레그레이즈</button>
      </div>
    </div>
    <div class="exercise-category">
      <div class="category-label">🦵 하체</div>
      <div class="exercise-grid">
        <button class="exercise-btn" data-name="스쿼트" onclick="selectPreset('스쿼트','reps','🦵')">🦵 스쿼트</button>
        <button class="exercise-btn" data-name="런지" onclick="selectPreset('런지','reps','🦵')">🦵 런지</button>
        <button class="exercise-btn" data-name="점프 스쿼트" onclick="selectPreset('점프 스쿼트','reps','🦵')">🦵 점프 스쿼트</button>
        <button class="exercise-btn" data-name="글루트 브릿지" onclick="selectPreset('글루트 브릿지','reps','🦵')">🦵 글루트 브릿지</button>
        <button class="exercise-btn" data-name="카프레이즈" onclick="selectPreset('카프레이즈','reps','🦵')">🦵 카프레이즈</button>
      </div>
    </div>
    <div class="exercise-category">
      <div class="category-label">⚡ 전신</div>
      <div class="exercise-grid">
        <button class="exercise-btn" data-name="버피" onclick="selectPreset('버피','reps','⚡')">⚡ 버피</button>
        <button class="exercise-btn" data-name="점핑잭" onclick="selectPreset('점핑잭','reps','⚡')">⚡ 점핑잭</button>
        <button class="exercise-btn" data-name="하이니" onclick="selectPreset('하이니','reps','⚡')">⚡ 하이니</button>
      </div>
    </div>
    <div class="exercise-category">
      <div class="category-label">✏️ 직접 입력</div>
      <div class="custom-input-wrap">
        <input id="custom-name" class="custom-input" type="text" placeholder="운동 이름 직접 입력"
          oninput="if(this.value)document.querySelectorAll('.exercise-btn').forEach(b=>b.classList.remove('selected'))">
        <div class="type-toggle">
          <button class="type-btn selected" data-type="reps" onclick="setCustomType('reps')">횟수</button>
          <button class="type-btn" data-type="time" onclick="setCustomType('time')">시간</button>
        </div>
      </div>
    </div>
    <button class="btn-confirm" onclick="confirmAddExercise()">추가하기</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
