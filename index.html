<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0e0f1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="운동일지">
  <title>운동 일지</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ── 로그인 화면 ── -->
<div id="login-screen" class="login-screen" style="display:none">
  <div class="login-box">
    <div class="login-logo">🏋️</div>
    <h1 class="login-title">운동 일지</h1>
    <p class="login-sub">매일 꾸준히, 나를 만들어가는 기록</p>
    <button class="btn-google-login" onclick="loginWithGoogle()">
      <svg width="20" height="20" viewBox="0 0 24 24">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Google로 로그인
    </button>
  </div>
</div>

<div id="app" style="display:none">

  <!-- 헤더 (캘린더 탭에서만 표시) -->
  <header class="app-header" id="cal-header">
    <button class="month-nav-btn" onclick="prevMonth()">‹</button>
    <button class="month-title-btn" onclick="goToToday()">
      <span id="month-label">2026년 6월</span>
    </button>
    <div style="display:flex;align-items:center;gap:8px">
      <button class="month-nav-btn" onclick="nextMonth()">›</button>
      <img id="user-avatar" class="user-avatar" style="display:none" onclick="confirmLogout()" title="로그아웃">
    </div>
  </header>

  <!-- 캘린더 뷰 -->
  <div id="view-calendar" class="view active">
    <div class="weekday-row">
      <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
    </div>
    <div id="calendar-grid"></div>
  </div>

  <!-- 통계 뷰 -->
  <div id="view-stats" class="view">
    <div class="view-title">운동 기록</div>
    <div id="stats-content"></div>
  </div>

  <!-- 하단 네비게이션 -->
  <nav class="tab-nav">
    <button class="tab-btn active" data-tab="calendar" onclick="switchTab('calendar')">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      <span>캘린더</span>
    </button>
    <button class="tab-btn" data-tab="stats" onclick="switchTab('stats')">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
      </svg>
      <span>통계</span>
    </button>
  </nav>
</div>

<!-- ── 운동 기록 모달 ── -->
<div id="workout-modal" class="modal-overlay" onclick="if(event.target===this)closeWorkoutModal()">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-top">
      <div id="modal-date-label" class="modal-date-label"></div>
      <button class="modal-close-btn" onclick="closeWorkoutModal()">✕</button>
    </div>
    <div id="modal-exercise-list"></div>
    <button class="btn-add-exercise" onclick="openAddModal()">＋ 운동 추가</button>
    <button class="btn-start-workout" onclick="startActiveWorkout()">▶ 운동 시작</button>
    <button class="btn-save-workout" onclick="saveModalWorkout()">저장만 하기</button>
  </div>
</div>

<!-- ── 운동 선택 모달 ── -->
<div id="add-modal" class="modal-overlay" onclick="if(event.target===this)closeAddModal()">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">운동 추가</div>

    <div class="exercise-category">
      <button class="cat-toggle" onclick="toggleCat(this)">
        <span>💪 상체</span><span class="cat-arrow">›</span>
      </button>
      <div class="cat-body">
        <div class="exercise-grid">
          <button class="exercise-btn" data-name="푸시업" onclick="selectPreset('푸시업','reps','💪')">💪 푸시업</button>
          <button class="exercise-btn" data-name="와이드 푸시업" onclick="selectPreset('와이드 푸시업','reps','💪')">💪 와이드 푸시업</button>
          <button class="exercise-btn" data-name="다이아몬드 푸시업" onclick="selectPreset('다이아몬드 푸시업','reps','💪')">💪 다이아몬드</button>
          <button class="exercise-btn" data-name="파이크 푸시업" onclick="selectPreset('파이크 푸시업','reps','💪')">💪 파이크 푸시업</button>
          <button class="exercise-btn" data-name="딥스" onclick="selectPreset('딥스','reps','🤸')">🤸 딥스</button>
          <button class="exercise-btn" data-name="친업 / 풀업" onclick="selectPreset('친업 / 풀업','reps','🏋️')">🏋️ 친업 / 풀업</button>
        </div>
      </div>
    </div>
    <div class="exercise-category">
      <button class="cat-toggle" onclick="toggleCat(this)">
        <span>🔥 코어</span><span class="cat-arrow">›</span>
      </button>
      <div class="cat-body">
        <div class="exercise-grid">
          <button class="exercise-btn" data-name="플랭크" onclick="selectPreset('플랭크','time','🔥')">🔥 플랭크</button>
          <button class="exercise-btn" data-name="사이드 플랭크" onclick="selectPreset('사이드 플랭크','time','🔥')">🔥 사이드 플랭크</button>
          <button class="exercise-btn" data-name="크런치" onclick="selectPreset('크런치','reps','🔥')">🔥 크런치</button>
          <button class="exercise-btn" data-name="V업" onclick="selectPreset('V업','reps','🔥')">🔥 V업</button>
          <button class="exercise-btn" data-name="마운틴 클라이머" onclick="selectPreset('마운틴 클라이머','reps','⚡')">⚡ 마운틴 클라이머</button>
          <button class="exercise-btn" data-name="레그레이즈" onclick="selectPreset('레그레이즈','reps','🔥')">🔥 레그레이즈</button>
        </div>
      </div>
    </div>
    <div class="exercise-category">
      <button class="cat-toggle" onclick="toggleCat(this)">
        <span>🦵 하체</span><span class="cat-arrow">›</span>
      </button>
      <div class="cat-body">
        <div class="exercise-grid">
          <button class="exercise-btn" data-name="스쿼트" onclick="selectPreset('스쿼트','reps','🦵')">🦵 스쿼트</button>
          <button class="exercise-btn" data-name="런지" onclick="selectPreset('런지','reps','🦵')">🦵 런지</button>
          <button class="exercise-btn" data-name="점프 스쿼트" onclick="selectPreset('점프 스쿼트','reps','🦵')">🦵 점프 스쿼트</button>
          <button class="exercise-btn" data-name="글루트 브릿지" onclick="selectPreset('글루트 브릿지','reps','🦵')">🦵 글루트 브릿지</button>
          <button class="exercise-btn" data-name="카프레이즈" onclick="selectPreset('카프레이즈','reps','🦵')">🦵 카프레이즈</button>
        </div>
      </div>
    </div>
    <div class="exercise-category">
      <button class="cat-toggle" onclick="toggleCat(this)">
        <span>⚡ 전신</span><span class="cat-arrow">›</span>
      </button>
      <div class="cat-body">
        <div class="exercise-grid">
          <button class="exercise-btn" data-name="버피" onclick="selectPreset('버피','reps','⚡')">⚡ 버피</button>
          <button class="exercise-btn" data-name="점핑잭" onclick="selectPreset('점핑잭','reps','⚡')">⚡ 점핑잭</button>
          <button class="exercise-btn" data-name="하이니" onclick="selectPreset('하이니','reps','⚡')">⚡ 하이니</button>
        </div>
      </div>
    </div>
    <div class="exercise-category">
      <button class="cat-toggle" onclick="toggleCat(this)">
        <span>🏃 러닝</span><span class="cat-arrow">›</span>
      </button>
      <div class="cat-body">
        <div class="exercise-grid">
          <button class="exercise-btn" data-name="달리기" onclick="selectPreset('달리기','time','🏃')">🏃 달리기</button>
          <button class="exercise-btn" data-name="인터벌 러닝" onclick="selectPreset('인터벌 러닝','time','🏃')">🏃 인터벌 러닝</button>
          <button class="exercise-btn" data-name="걷기" onclick="selectPreset('걷기','time','🚶')">🚶 걷기</button>
          <button class="exercise-btn" data-name="줄넘기" onclick="selectPreset('줄넘기','reps','🪢')">🪢 줄넘기</button>
          <button class="exercise-btn" data-name="사이클" onclick="selectPreset('사이클','time','🚴')">🚴 사이클</button>
        </div>
      </div>
    </div>
    <div class="exercise-category">
      <div class="category-label">✏️ 직접 입력</div>
      <div class="custom-input-wrap">
        <input id="custom-name" class="custom-input" type="text" placeholder="운동 이름 직접 입력"
          oninput="document.querySelectorAll('.exercise-btn').forEach(b=>b.classList.remove('selected'));if(this.value.length>1)showPrevRecord(this.value)">
      </div>
    </div>
    <!-- 운동 전체 시간 -->
    <div class="duration-section">
      <div class="category-label">⏱ 운동 시간 (선택)</div>
      <div class="duration-adj-row">
        <button class="dur-adj-btn" onclick="adjDuration(-1)">−</button>
        <span id="dur-display">없음</span>
        <button class="dur-adj-btn" onclick="adjDuration(1)">＋</button>
      </div>
    </div>

    <!-- 직전 기록 -->
    <div id="prev-record-section" class="prev-record-section" style="display:none">
      <div class="category-label">📋 직전 기록</div>
      <div id="prev-record-content"></div>
    </div>

    <button class="btn-confirm" onclick="confirmAddExercise()">추가하기</button>
  </div>
</div>

<!-- ── 운동 중 화면 ── -->
<div id="active-workout" class="active-workout-screen">

  <!-- 헤더 -->
  <div class="aw-header">
    <button class="aw-back-btn" onclick="exitActiveWorkout()">← 나가기</button>
    <div class="aw-header-center">
      <div id="aw-exercise-name" class="aw-exercise-name"></div>
      <div id="aw-progress-text" class="aw-progress-text"></div>
    </div>
    <button class="aw-finish-btn" onclick="finishActiveWorkout()">종료</button>
  </div>

  <div class="aw-body">

    <!-- 세트 배지 -->
    <div class="aw-set-badge" id="aw-set-label">세트 1</div>

    <!-- 시간 + 세트 완료 한 줄 -->
    <div class="aw-timer-complete-row">
      <div class="aw-sw-left">
        <div class="aw-sw-display" id="aw-sw-display">00:00</div>
        <div class="aw-sw-mini-btns">
          <button id="aw-sw-btn" class="aw-sw-mini-start" onclick="toggleStopwatch()">▶</button>
          <button class="aw-sw-mini-reset" onclick="resetStopwatch()">↺</button>
        </div>
      </div>
      <button class="aw-complete-set-btn" onclick="completeSet()">✓ 세트<br>완료</button>
    </div>

    <!-- 횟수 입력 -->
    <div class="aw-reps-row">
      <button class="aw-count-btn" onclick="adjustReps(-1)">−</button>
      <input type="number" id="aw-reps" class="aw-reps-input" value="0" min="0" inputmode="numeric">
      <span class="aw-unit" id="aw-unit">회</span>
      <button class="aw-count-btn" onclick="adjustReps(1)">＋</button>
    </div>

    <!-- 세트 기록 표 -->
    <div id="aw-table-section" style="display:none">
      <div class="aw-table-title">세트 기록</div>
      <div class="aw-table-wrap">
        <table class="aw-table" id="aw-table"></table>
      </div>
    </div>

  </div>

  <!-- 이전/다음 -->
  <div class="aw-bottom">
    <div class="aw-nav-row">
      <button id="aw-btn-prev" class="aw-nav-btn" onclick="prevExercise()">← 이전</button>
      <button id="aw-btn-next" class="aw-nav-btn" onclick="nextExercise()">다음 →</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
